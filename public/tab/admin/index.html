<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Admin</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/app.css"><style>
body{background:var(--bg)}#app{max-width:none;padding:0}body::before{display:none}.ad{display:grid;grid-template-columns:1fr;min-height:100vh}
.sb{position:sticky;top:0;z-index:7;display:flex;gap:6px;overflow-x:auto;align-items:center;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--br)}
.sb button{background:none;border:0;color:var(--mu);padding:9px 14px;border-radius:10px;font:600 14px inherit;font-family:inherit;white-space:nowrap;cursor:pointer;text-align:left}.sb button.on{background:var(--ac2);color:var(--ac)}.sb .bd{font:700 17px Georgia,serif;padding:0 8px}.sb .lk{color:var(--mu);font-size:13px;white-space:nowrap;padding:0 8px;text-decoration:none}
.mn{padding:18px 16px 120px;max-width:980px;width:100%}.mn h1{font-size:24px;margin-bottom:6px}.mn h2{margin:4px 0 12px}.mn .cd{backdrop-filter:none;margin:0 0 14px;padding:16px}
.g[hidden]{display:none}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}.fg>div{min-width:0}
.ar{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--br)}.ar input{margin:0}
.sv{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;justify-content:flex-end;padding:12px 16px;background:var(--bg);border-top:1px solid var(--br);z-index:8}
@media(min-width:900px){.ad{grid-template-columns:240px 1fr}.sb{flex-direction:column;align-items:stretch;height:100vh;padding:22px 14px;overflow:auto;border-bottom:0;border-right:1px solid var(--br)}.sb .bd{margin-bottom:12px}.mn{padding:30px 36px 120px}.sv{left:240px}.ar{grid-template-columns:2.2fr 1fr 1fr 1fr auto;align-items:center}}
</style></head><body>
<div id="app"></div><script src="/common.js"></script><script>
const $=i=>document.getElementById(i);let S,ST,busy=false;
async function api(u,m,b){const r=await fetch(u,{method:m||'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401){loginView();throw new Error('auth')}if(!r.ok)throw new Error(j.error||('Error '+r.status));return j}
function loginView(){$('app').innerHTML=`<div class="cd v" style="margin-top:12vh"><h1>Admin</h1><p class="mu">Masuk untuk mengelola situs.</p><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div class="mu" id="lm" style="color:var(--ac);min-height:20px"></div><button class="btn bw" id="lb">Masuk</button></div>`;
 const go=async()=>{try{await api('/api/admin/login','POST',{password:$('pw').value});boot()}catch(e){if(e.message!=='auth')$('lm').textContent=e.message}};$('lb').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()}}
async function boot(){try{S=await(await fetch('/api/site')).json();S.links=Object.assign({web:'',app:'',ig:'',tt:'',x:''},S.links);S.galeri=S.galeri||[];S.lines=S.lines&&S.lines.length?S.lines:['Reguler'];S.prov=S.prov||'Sumatera Barat';S.kab=S.kab||'Kota Padang';S.paket.forEach(p=>{p.ln=p.ln||S.lines[0];p.inc=!!p.inc});S.footer=S.footer||'© 2026 DPP - Sales Padang\nMyRepublic Account Executive · @dimasputrapratama.id';ST=await api('/api/admin/stats');ST.refs=(await api('/api/admin/refs')).refs;S.paket.forEach(p=>p.rw=Object.assign({m1:20000,m2:20000,m3:50000},p.rw));S.adm=S.adm||0;S.footerUrl=S.footerUrl||'';S.biaya=S.biaya||[];S.ref=Object.assign({on:true,months:3,terms:[],needInstalled:false,confirm:'Terima kasih! Pendaftaran kerabatmu sudah kami terima. Insentif dicairkan setelah WiFi kerabatmu berstatus aktif dan pembayaran pertama lunas.'},S.ref);draw()}catch(e){}}
function f(l,p,t='text'){const v=p.split('.').reduce((o,k)=>o[k],S);return `<div><label>${l}</label><input type="${t}" value="${E(v)}" oninput="sv('${p}',this.value,'${t}')"></div>`}
function sv(p,v,t){const k=p.split('.'),l=k.pop(),o=k.reduce((o,x)=>o[x],S);o[l]=t==='number'?+v||0:v}
async function up(fl,i){if(!fl)return;try{const bm=await createImageBitmap(fl),mx=i==null?256:900,k=Math.min(1,mx/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);const r=await api('/api/admin/upload','POST',{data:cv.toDataURL(i==null?'image/png':'image/jpeg',.82)});if(i==null)S.logo=r.url;else if(i==='g')S.galeri.push(r.url);else S.paket[i].img=r.url;draw()}catch(e){alert(e.message||'Gambar tidak bisa diproses')}}
async function save(){if(busy)return;busy=true;$('sv').textContent='Menyimpan…';try{await api('/api/admin/site','PUT',S);$('sm').textContent='Tersimpan. Perubahan langsung tampil di situs.'}catch(e){$('sm').textContent='Gagal: '+e.message}busy=false;$('sv').textContent='Simpan perubahan'}
async function setSt(c,s){try{await api('/api/admin/lead','PUT',{code:c,status:s})}catch(e){alert(e.message)}}
async function hid(c,h){try{await api('/api/admin/review','PUT',{code:c,hidden:h});(ST.reviews.find(x=>x.code===c)||{}).hidden=h;draw()}catch(e){alert(e.message)}}
async function saveRef(id){const g=k=>$(k+id),R0=ST.refs.find(x=>x.id===id),paid={};(R0.ms||[]).forEach((m,k)=>paid[m.k]=$('pd'+id+'_'+k).checked);try{const r=await api('/api/admin/ref','PUT',{id,status:g('rs').value,first_paid:g('rp').checked,months_ok:g('rm').checked,paid,note:g('rn').value});ST.refs[ST.refs.findIndex(x=>x.id===id)]=r.ref;draw()}catch(e){alert(e.message);draw()}}
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const TABS=[['dash','Dashboard'],['pesanan','Pesanan'],['paket','Paket & Layanan'],['wilayah','Wilayah'],['referral','Referral'],['konten','Konten'],['umum','Pengaturan']];let TB='dash';
function side(){return `<div class="ad"><nav class="sb"><div class="bd">Admin</div>${TABS.map(t=>`<button class="${t[0]===TB?'on':''}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('')}<a class="lk" href="/" target="_blank">Lihat situs</a><a class="lk" href="#" onclick="out();return false">Keluar</a></nav>`}
function tab(k){TB=k;document.querySelectorAll('.sb button').forEach((b,i)=>b.classList.toggle('on',TABS[i]&&TABS[i][0]===k));document.querySelectorAll('.g').forEach(e=>e.hidden=e.dataset.g!==k);scrollTo(0,0)}
function draw(){draw0();tab(TB);S.paket.forEach((p,i)=>pbk(i));wlInit()}
const chk=()=>[[S.wa,'Nomor WhatsApp sales diisi'],[S.verified,'Harga ditandai terverifikasi'],[S.footerUrl,'Tautan copyright (@dimasputrapratama.id) diisi'],[S.links.ig||S.links.tt||S.links.x,'Minimal satu kanal sosial diisi'],[S.area.some(x=>x.c),'Ada wilayah terjangkau']].map(x=>`<div style="color:${x[0]?'var(--ok)':'var(--ac)'};padding:2px 0">${x[0]?'✓':'○'} ${x[1]}</div>`).join('');
function pbk(i){const p=S.paket[i],e=$('pb'+i);if(!e)return;const d=p.inc?Math.round(p.h/(1+S.ppn/100)):p.h,t=p.inc?p.h:Math.round(p.h*(1+S.ppn/100));e.textContent='DPP '+rp(d)+' · PPN '+S.ppn+'% '+rp(t-d)+' · Total '+rp(t)}
function rn(i,v){const o=S.lines[i];S.lines[i]=v;S.paket.forEach(p=>{if(p.ln===o)p.ln=v})}
function dl(i){if(S.lines.length<2)return alert('Minimal satu kelompok');const o=S.lines.splice(i,1)[0];S.paket.forEach(p=>{if(p.ln===o)p.ln=S.lines[0]});draw()}
const WB='https://emsifa.github.io/api-wilayah-indonesia/api/',WC={};
const wj=async p=>WC[p]||(WC[p]=await(await fetch(WB+p+'.json')).json());
const tc=s=>String(s).toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
function fs(id,l,ph){$(id).innerHTML=`<option value="">${ph}</option>`+l.map(x=>`<option value="${x.id}">${E(tc(x.name))}</option>`).join('')}
async function wlInit(){if(!$('w1'))return;try{fs('w1',await wj('provinces'),'Pilih provinsi');fs('w2',[],'Pilih kota/kabupaten');fs('w3',[],'Pilih kecamatan');fs('w4',[],'Tanpa desa (level kecamatan)');
 $('w1').onchange=async()=>{fs('w2',$('w1').value?await wj('regencies/'+$('w1').value):[],'Pilih kota/kabupaten');fs('w3',[],'Pilih kecamatan');fs('w4',[],'Tanpa desa')};
 $('w2').onchange=async()=>{fs('w3',$('w2').value?await wj('districts/'+$('w2').value):[],'Pilih kecamatan');fs('w4',[],'Tanpa desa')};
 $('w3').onchange=async()=>fs('w4',$('w3').value?await wj('villages/'+$('w3').value):[],'Tanpa desa (level kecamatan)')}catch(e){$('wm').textContent='Data wilayah belum bisa dimuat. Isi manual lewat koordinat.'}}
async function wAdd(){const t=id=>{const o=$(id).selectedOptions[0];return o&&o.value?tc(o.textContent):''},pv=t('w1'),kb=t('w2'),kc=t('w3'),ds=t('w4');if(!kc){$('wm').textContent='Pilih minimal sampai kecamatan.';return}
 const n=ds?ds+', '+kc:kc;if(S.area.some(x=>x.n===n)){$('wm').textContent='Wilayah ini sudah ada.';return}$('wm').textContent='Mencari koordinat…';let la='',ln='';
 try{const j=await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent([ds,kc,kb,pv,'Indonesia'].filter(Boolean).join(', ')))).json();if(j[0]){la=(+j[0].lat).toFixed(5);ln=(+j[0].lon).toFixed(5)}}catch(e){}
 S.area.push({n,c:1,lvl:ds?'desa':'kec',kec:ds?kc:'',kab:kb,prov:pv,lat:la,lng:ln,r:0});draw();$('wm').textContent=la?'Ditambahkan dengan koordinat otomatis. Periksa posisinya.':'Ditambahkan, tetapi koordinat tidak ditemukan. Isi manual.'}
async function out(){try{await api('/api/admin/logout','POST')}catch(e){}loginView()}
function draw0(){const s=ST.stats||{},ph=l=>String(l.wa).replace(/\D/g,'').replace(/^0/,'62');
 $('app').innerHTML=`${side()}<main class="mn v"><div class="g" data-g="dash"><div class="row" style="align-items:center"><h1>Dashboard</h1><div style="text-align:right"><a class="mu" href="/" target="_blank">Lihat situs</a> · <a class="mu" href="#" onclick="out();return false">Keluar</a></div></div>
 <div class="tiles" style="margin-top:12px">${[['Pesanan masuk',s.lead],['Cek area',s.area],['Buka simulasi',s.sim],['Kirim pertanyaan',s.ask]].map(x=>`<div class="tile">${x[1]||0}<div class="mu" style="color:var(--ok)">${x[0]}</div></div>`).join('')}</div>
 <div class="cd"><h3>Checklist sebelum dipublikasikan</h3>${chk()}</div></div><div class="g" data-g="pesanan"><h2>Pesanan terbaru</h2>${ST.leads.map(l=>`<div class="cd"><b>${E(l.nama)}</b> <span class="pill">${E(l.paket)}</span> <span class="mu">${E(l.code||'')}</span><select onchange="setSt('${E(l.code||'')}',this.value)" style="margin-top:6px">${['Diterima','Dihubungi','Survei','Jadwal pasang','Terpasang','Batal'].map(x=>`<option ${x===l.status?'selected':''}>${x}</option>`).join('')}</select><div class="mu">${new Date(l.t).toLocaleString('id-ID')} · ${E(l.area)}</div><p style="margin:6px 0">${E(l.alamat)}</p><a class="btn b2" target="_blank" rel="noopener" href="https://wa.me/${E(ph(l))}">WA ${E(l.wa)}</a>${l.lat?` <a class="mu" target="_blank" rel="noopener" href="https://maps.google.com/?q=${E(l.lat)},${E(l.lng)}">Lihat lokasi</a>`:''}</div>`).join('')||'<p class="mu">Belum ada pesanan.</p>'}
 </div><div class="g" data-g="umum"><h2>Pengaturan umum</h2><div class="cd">${f('Nama situs','brand')}${f('Nama sales','sales')}${f('No. WhatsApp (62…)','wa')}${f('Jatuh tempo','tempo')}${f('Biaya administrasi (Rp)','adm','number')}${f('Tautan klik copyright (https://…)','footerUrl')}<label>Rincian biaya (Nama | Nilai | Keterangan, satu per baris; kosong = otomatis)</label><textarea rows="4" oninput="S.biaya=this.value.split('\n').filter(Boolean).map(l=>{const k=l.split('|').map(x=>x.trim());return[k[0],k[1]||'',k.slice(2).join(' | ')]})">${E(S.biaya.map(x=>x.join(' | ')).join('\n'))}</textarea><label>Footer situs (satu baris per teks)</label><textarea rows="2" oninput="S.footer=this.value">${E(S.footer)}</textarea>
 <div class="fg">${f('Biaya pasang','inst','number')}${f('PPN %','ppn','number')}${f('Denda/bulan','denda','number')}</div>
 <label>Template pesan ({sales} {nama} {paket} {harga} {alamat} {area} {wa})</label><textarea rows="4" oninput="S.tpl=this.value">${E(S.tpl)}</textarea>
 <label>Logo</label><div class="row" style="align-items:center"><img src="${E(S.logo)}" style="flex:0 0 52px;width:52px;height:52px;border-radius:14px;object-fit:cover" alt=""><input type="file" accept="image/png,image/jpeg,image/webp" style="flex:1" onchange="up(this.files[0])"><button class="btn b2" style="flex:0" onclick="S.logo='/assets/logo.svg';draw()">Reset</button></div>
 <label style="display:block;margin-top:6px"><input type="checkbox" style="width:auto" ${S.verified?'checked':''} onchange="S.verified=this.checked"> Harga sudah terverifikasi (sembunyikan banner contoh)</label></div>
 </div><div class="g" data-g="paket"><h2>Kelompok layanan</h2><div class="cd"><p class="mu" style="margin:0 0 8px">Kelompokkan paket, misalnya Reguler, Neo, Velo. Pilih kelompok di tiap paket.</p>${S.lines.map((l,i)=>`<div class="row" style="margin-bottom:6px"><input value="${E(l)}" oninput="rn(${i},this.value)"><button class="btn b2" style="flex:0" onclick="dl(${i})">Hapus</button></div>`).join('')}<button class="btn b2" onclick="S.lines.push('Baru '+(S.lines.length+1));draw()">Tambah kelompok</button></div><h2>Paket</h2>${S.paket.map((p,i)=>`<div class="cd">${f('Nama',`paket.${i}.n`)}<div class="fg">${f('Kecepatan',`paket.${i}.s`)}<div><label>Harga/bulan (Rp)</label><input type="number" value="${p.h}" oninput="sv('paket.${i}.h',this.value,'number');pbk(${i})"><label style="display:block;color:var(--tx)"><input type="checkbox" style="width:auto" ${p.inc?'checked':''} onchange="S.paket[${i}].inc=this.checked;pbk(${i})"> Harga sudah termasuk PPN</label><div class="mu" id="pb${i}"></div></div></div>${f('Deskripsi',`paket.${i}.d`)}<div><label>Masuk kelompok layanan</label><select onchange="S.paket[${i}].ln=this.value">${S.lines.map(l=>`<option ${l===p.ln?'selected':''}>${E(l)}</option>`).join('')}</select></div><label>Reward referral paket ini (Rp)</label><div class="fg">${f('Terpasang',`paket.${i}.rw.m1`,'number')}${f('Bayar pertama',`paket.${i}.rw.m2`,'number')}${f(S.ref.months+' bulan',`paket.${i}.rw.m3`,'number')}</div>
 <label>Gambar paket</label><div class="row" style="align-items:center"><div style="flex:0 0 120px;overflow:hidden;border-radius:12px">${p.img?`<img src="${E(p.img)}" style="width:100%;height:64px;object-fit:cover;display:block" alt="">`:art(p,i).replace('class="pi"','style="width:100%;height:64px;display:block"')}</div><input type="file" accept="image/png,image/jpeg,image/webp" style="flex:1" onchange="up(this.files[0],${i})">${p.img?`<button class="btn b2" style="flex:0" onclick="delete S.paket[${i}].img;draw()">Reset</button>`:''}</div>
 <button class="btn b2" onclick="S.paket.splice(${i},1);draw()">Hapus paket</button></div>`).join('')}
 <button class="btn b2 bw" onclick="S.paket.push({n:'Baru',s:'',h:0,d:''});draw()">Tambah paket</button>
 </div><div class="g" data-g="referral"><h2>Program referral</h2><div class="cd"><label style="display:block"><input type="checkbox" style="width:auto" ${S.ref.on?'checked':''} onchange="S.ref.on=this.checked"> Program referral dibuka</label>${f('Masa langganan wajib (bulan)','ref.months','number')}<label>Syarat dan ketentuan (satu poin per baris, kosong = bawaan)</label><textarea rows="4" oninput="S.ref.terms=this.value.split('\n').filter(Boolean)">${E((S.ref.terms||[]).join('\n'))}</textarea><label style="display:block;margin:6px 0"><input type="checkbox" style="width:auto" ${S.ref.needInstalled?'checked':''} onchange="S.ref.needInstalled=this.checked"> Akses hanya untuk pelanggan berstatus Terpasang</label><label>Pesan konfirmasi setelah kirim</label><textarea rows="3" oninput="S.ref.confirm=this.value">${E(S.ref.confirm)}</textarea><div class="mu">Simpan perubahan di tombol bawah. Reward diatur per paket di bagian Paket dan berlaku untuk pendaftaran baru.</div></div>
 <h2>Pendaftaran referral (${ST.refs.length})</h2>${ST.refs.map(x=>`<div class="cd"><b>${E(x.referee_name)}</b> <span class="mu">#${x.id} · ${new Date(x.created_at).toLocaleDateString('id-ID')}</span><div class="mu">Calon: <a target="_blank" rel="noopener" href="https://wa.me/${E(x.referee_phone)}">${E(x.referee_phone)}</a></div><p style="margin:6px 0">${E(x.installation_address)}${x.lat?` <a target="_blank" rel="noopener" href="https://maps.google.com/?q=${E(x.lat)},${E(x.lng)}">Peta</a>`:''}</p>
 <div class="mu">Pemberi: ${E(x.referrer_name)} · <a target="_blank" rel="noopener" href="https://wa.me/${E(x.referrer_phone)}">${E(x.referrer_phone)}</a><br>Pencairan: <b>${E(x.referrer_ewallet)}</b></div>
 <select id="rs${x.id}" style="margin-top:8px">${['PENDING_ODP','SURVEY','INSTALLED_ACTIVE','PAID_REWARD','REJECTED'].map(k=>`<option ${k===x.status?'selected':''}>${k}</option>`).join('')}</select>
 <div class="mu" style="margin-top:6px">Paket: <b>${E(x.paket||'-')}</b></div><label style="display:block"><input type="checkbox" id="rp${x.id}" style="width:auto" ${x.first_paid?'checked':''}> Pembayaran pertama lunas</label><label style="display:block"><input type="checkbox" id="rm${x.id}" style="width:auto" ${x.months_ok?'checked':''}> Lolos ${S.ref.months} bulan tanpa telat</label>${(x.ms||[]).map((m,k)=>`<label style="display:block;color:var(--tx)"><input type="checkbox" id="pd${x.id}_${k}" style="width:auto" ${m.paid?'checked':''}> Ditransfer: ${E(m.label)} (${rp(m.amt)})</label>`).join('')}<input id="rn${x.id}" placeholder="Catatan" value="${E(x.note)}" style="margin-top:8px"><button class="btn" onclick="saveRef(${x.id})">Simpan</button></div>`).join('')||'<p class="mu">Belum ada pendaftaran.</p>'}
 </div><div class="g" data-g="konten"><h2>Kanal</h2><div class="cd">${f('Situs resmi MyRepublic (https://…)','links.web')}${f('Aplikasi MyRep di Play Store (https://…)','links.app')}${f('Instagram sales (https://…)','links.ig')}${f('TikTok sales (https://…)','links.tt')}${f('X sales (https://…)','links.x')}</div>
 <h2>Foto pemasangan</h2><div class="cd"><div class="row">${S.galeri.map((g,i)=>`<div style="flex:0 0 30%"><img src="${E(g)}" style="width:100%;height:70px;object-fit:cover;border-radius:10px" alt=""><button class="btn b2" style="padding:4px 8px;margin-top:4px" onclick="S.galeri.splice(${i},1);draw()">Hapus</button></div>`).join('')}</div><label>Tambah foto (izin pelanggan wajib)</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="up(this.files[0],'g')"></div>
 <h2>Ulasan masuk</h2>${(ST.reviews||[]).map(x=>`<div class="cd"><b>${E(x.n)}</b> <span class="mu">${E(x.a)} · ${x.r}/5 · ${E(x.code)}</span><p style="margin:6px 0">${E(x.t)}</p><button class="btn b2" onclick="hid('${E(x.code)}',${!x.hidden})">${x.hidden?'Tampilkan lagi':'Sembunyikan'}</button></div>`).join('')||'<p class="mu">Belum ada ulasan.</p>'}
 </div><div class="g" data-g="wilayah"><h2>Wilayah layanan</h2><div class="cd"><div class="fg">${f('Provinsi','prov')}${f('Kota / Kabupaten','kab')}</div></div>
 <div class="cd"><h3>Tambah dari data wilayah</h3><div class="fg"><div><label>Provinsi</label><select id="w1"></select></div><div><label>Kota/Kabupaten</label><select id="w2"></select></div><div><label>Kecamatan</label><select id="w3"></select></div><div><label>Desa/Kelurahan</label><select id="w4"></select></div></div><button class="btn" onclick="wAdd()">Tambah wilayah</button><div class="mu" id="wm" style="margin-top:8px"></div></div>
 <div class="cd"><h3>Daftar wilayah (${S.area.length})</h3>${S.area.map((x,i)=>`<div class="ar"><label style="color:var(--tx)"><input type="checkbox" style="width:auto" ${x.c?'checked':''} onchange="S.area[${i}].c=this.checked?1:0"> <b>${E(x.n)}</b> <span class="mu">${x.lvl==='desa'?'Desa':'Kecamatan'}</span></label><input placeholder="Lat" value="${x.lat??''}" oninput="S.area[${i}].lat=this.value"><input placeholder="Lng" value="${x.lng??''}" oninput="S.area[${i}].lng=this.value"><input type="number" placeholder="Radius (m)" value="${x.r||''}" oninput="S.area[${i}].r=+this.value||0"><button class="btn b2" onclick="S.area.splice(${i},1);draw()">Hapus</button></div>`).join('')}</div>
 </div><div class="g" data-g="umum"><h2>Pembayaran &amp; FAQ</h2><div class="cd"><label>Info pembayaran (satu poin per baris)</label><textarea rows="4" oninput="S.bayar=this.value.split('\\n').filter(Boolean)">${E(S.bayar.join('\n'))}</textarea>
 <label>FAQ (format: Pertanyaan | Jawaban, satu per baris)</label><textarea rows="5" oninput="S.faq=this.value.split('\\n').filter(Boolean).map(l=>{const k=l.split('|');return[(k[0]||'').trim(),k.slice(1).join('|').trim()]})">${E(S.faq.map(x=>x.join(' | ')).join('\n'))}</textarea></div>
 </div></main><div class="sv"><span class="mu" id="sm"></span><button class="btn" id="sv" onclick="save()">Simpan perubahan</button></div></div>`}
boot().then(()=>{if(!ST)loginView()});
</script></body></html>
