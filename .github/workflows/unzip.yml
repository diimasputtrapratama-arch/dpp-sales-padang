name: Unzip
on:
  push:
      paths: ['dpp-sales-padang.zip']
        workflow_dispatch:
        permissions:
          contents: write
          jobs:
            unzip:
                runs-on: ubuntu-latest
                    steps:
                          - uses: actions/checkout@v4
                                - name: Extract
                                        run: |
                                                  test -f dpp-sales-padang.zip || { echo "zip tidak ada"; exit 0; }
                                                            unzip -q dpp-sales-padang.zip -d _x
                                                                      cp -r _x/dpp-sales-padang/. .
                                                                                rm -rf _x dpp-sales-padang.zip
                                                                                      - name: Commit
                                                                                              run: |
                                                                                                        git config user.name "github-actions"
                                                                                                                  git config user.email "github-actions@users.noreply.github.com"
                                                                                                                            git add -A
                                                                                                                                      if ! git diff --cached --quiet; then
                                                                                                                                                  git commit -m "Extract dpp-sales-padang.zip"
                                                                                                                                                              git push
                                                                                                                                                                        fi